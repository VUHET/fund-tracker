<script>
const manifest = {
  name:"投資信託トラッカー", short_name:"投資トラッカー",
  description:"投資信託のポートフォリオを管理するアプリ",
  start_url:"./", display:"standalone",
  background_color:"#f0f7ff", theme_color:"#3b82f6", orientation:"portrait",
  icons:[
    {src:"https://cdn-icons-png.flaticon.com/512/2977/2977860.png",sizes:"192x192",type:"image/png"},
    {src:"https://cdn-icons-png.flaticon.com/512/2977/2977860.png",sizes:"512x512",type:"image/png"}
  ]
};
const mblob = new Blob([JSON.stringify(manifest)],{type:"application/json"});
const mlink = document.createElement("link");
mlink.rel="manifest"; mlink.href=URL.createObjectURL(mblob);
document.currentScript.parentNode.appendChild(mlink);

const swCode=`
self.addEventListener('install',e=>self.skipWaiting());
self.addEventListener('activate',e=>e.waitUntil(self.clients.claim()));
self.addEventListener('fetch',e=>e.respondWith(fetch(e.request).catch(()=>new Response('offline'))));
`;
if('serviceWorker' in navigator){
  const swBlob=new Blob([swCode],{type:"text/javascript"});
  navigator.serviceWorker.register(URL.createObjectURL(swBlob),{scope:'./'}).catch(()=>{});
}
</script>

<style>
*{box-sizing:border-box;margin:0;padding:0;}
html,body{max-width:100%;overflow-x:hidden;}
body{background:#f0f7ff;color:#1e293b;font-family:'Helvetica Neue',sans-serif;padding-bottom:80px;font-size:14px;transition:background 0.8s ease,color 0.6s ease;}

/* ── 動的テーマ変数 ── */
:root {
  --theme-accent: #3b82f6;
  --theme-accent2: #60a5fa;
  --theme-header-from: #dbeafe;
  --theme-header-to: #f0f7ff;
  --theme-bg: #f0f7ff;
  --theme-border: #bfdbfe;
  --theme-label: #3b82f6;
  --theme-glow: rgba(59,130,246,0.3);
}
body { background: var(--theme-bg); transition: background 0.8s ease; }
.header { background: linear-gradient(180deg, var(--theme-header-from), var(--theme-header-to)) !important; transition: background 0.8s ease; }
.update-btn { background: var(--theme-accent) !important; box-shadow: 0 2px 6px var(--theme-glow) !important; }
.tab.active { background: var(--theme-accent) !important; }
.mbtn.active { background: var(--theme-accent) !important; }
.lock-btn { background: var(--theme-accent) !important; }
.btn-primary { background: var(--theme-accent) !important; }
.app-label { color: var(--theme-label) !important; }
.update-btn { transition: background 0.8s ease, box-shadow 0.8s ease; }

/* ── テーマ遷移アニメーション ── */
@keyframes themeFlash {
  0%{opacity:0;} 40%{opacity:0.15;} 100%{opacity:0;}
}
#themeFlash {
  display:none;position:fixed;inset:0;z-index:998;pointer-events:none;
  animation: themeFlash 0.9s ease forwards;
}
#themeFlash.show { display:block; }

/* ── 幾何学テクスチャオーバーレイ ── */
#geoTexture {
  display:none;position:fixed;inset:0;z-index:0;pointer-events:none;opacity:0;
  transition:opacity 1.2s ease;
}
#geoTexture.show { display:block; opacity:1; }

/* ── テーマバッジ（右下） ── */
#themeBadge {
  display:none;position:fixed;bottom:16px;right:16px;z-index:50;
  padding:6px 12px;border-radius:20px;font-size:11px;font-weight:800;
  box-shadow:0 2px 12px rgba(0,0,0,0.15);
  animation:badgeIn 0.5s cubic-bezier(0.34,1.56,0.64,1) forwards;
  pointer-events:none;
}
@keyframes badgeIn{from{transform:translateY(20px);opacity:0;}to{transform:translateY(0);opacity:1;}}

.tbl-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;width:100%;}
.tbl-wrap table{min-width:420px;}
.sim-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;}
.sim-result{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:12px;background:#f0f9ff;border-radius:10px;border:1px solid #bae6fd;}

.hist-stat{flex:1 1 calc(50% - 6px);min-width:0;}
.corr-wrap{width:100%;overflow-x:hidden;}
input[type=number]{box-sizing:border-box;width:100%;}

/* ロック画面 */
#lockScreen{

/* メインアプリ */

/* ── ステルスモード ── */

  position: fixed; top: 12px; left: 50%; transform: translateX(-50%);

/* マスク対象：.masked クラスが付いた要素を blur+テキスト置換で隠す */

}

}

<script>
// ===== ストレージ（セッションのみ） =====
// localStorageには保存しない → ブラウザを閉じるとデータが消える
// sessionStorageに保存 → 同じタブ内だけ保持、URLからはアクセス不可
let DATA = null;

function loadFromSession() {
  try {
    const s = sessionStorage.getItem('fundTrackerData');
    return s ? JSON.parse(s) : null;
  } catch(e) { return null; }
}
function saveToSession(d) {
  try { sessionStorage.setItem('fundTrackerData', JSON.stringify(d)); } catch(e) {}
}
function clearSession() {
  try { sessionStorage.removeItem('fundTrackerData'); } catch(e) {}
}

// ===== ロック画面 =====
function unlockWithFile(input) {
  const file = input.files[0];
  if (!file) return;
  const errEl = document.getElementById('lockErr');
  const reader = new FileReader();
  reader.onload = e => {
    try {
      const parsed = JSON.parse(e.target.result);
      if (!parsed.history || !parsed.funds) throw new Error('historyとfundsが必要です');
      DATA = parsed;
      saveToSession(DATA);
      showApp();
    } catch(err) {
      errEl.innerHTML = `<div class="lock-err">❌ エラー：${err.message}</div>`;
    }
  };
  reader.readAsText(file);
}

function importFile(input) {
  const file = input.files[0];
  if (!file) return;
  const msgEl = document.getElementById('modalMsg');
  const reader = new FileReader();
  reader.onload = e => {
    try {
      const parsed = JSON.parse(e.target.result);
      if (!parsed.history || !parsed.funds) throw new Error('historyとfundsが必要です');
      DATA = parsed;
      saveToSession(DATA);
      msgEl.innerHTML = '<div class="msg ok">✅ 更新しました！</div>';
      setTimeout(() => { closeModal(); checkAndFireATH(); init(); }, 800);
    } catch(err) {
      msgEl.innerHTML = `<div class="msg err">❌ エラー：${err.message}</div>`;
    }
  };
  reader.readAsText(file);
}

function logout() {
  if (!confirm('ロックしますか？データはこのタブを閉じるまで保持されます。')) return;
  clearSession();
  DATA = null;
  document.getElementById('app').style.display = 'none';
  document.getElementById('lockScreen').style.display = 'flex';
  document.getElementById('lockErr').innerHTML = '';
}

function showApp() {
  document.getElementById('lockScreen').style.display = 'none';
  document.getElementById('app').style.display = 'block';
  _lastKnownATH = null; // 初回ロード時はリセット
  _lastThemeKey = null; // テーマもリセット
  init();
}

// ===== 起動時チェックは全関数定義後に実行 =====
// ===== ユーティリティ =====
const fmt = v => v==null?"—":`<span class="money-val">¥${Number(v).toLocaleString("ja-JP")}</span>`;

// ===== ATH（過去最高値）計算 =====
function calcATH() {
  if (!DATA || !DATA.history || DATA.history.length === 0) return null;
  return Math.max(...DATA.history.map(d => d.total).filter(v => v != null));
}

// セッションに前回のATHを記憶し、更新時に演出を発火
let _lastKnownATH = null;
function checkAndFireATH() {
  const ath = calcATH();
  if (ath == null) return;
  const latest = DATA.history[DATA.history.length - 1];
  if (!latest) return;
  // 初回ロード時は記憶するだけ
  if (_lastKnownATH === null) { _lastKnownATH = ath; return; }
  // ATH更新検出
  if (latest.total != null && latest.total > _lastKnownATH) {
    _lastKnownATH = ath;
    fireATHCelebration();
  }
}
function fireATHCelebration() {
  // バナー表示
  const banner = document.getElementById('athBanner');
  banner.classList.add('show');
  setTimeout(() => banner.classList.remove('show'), 3500);
  // 紙吹雪
  const overlay = document.getElementById('confettiOverlay');
  overlay.innerHTML = '';
  overlay.classList.add('show');
  const colors = ['#fbbf24','#f59e0b','#34d399','#60a5fa','#f472b6','#a78bfa','#fb923c'];
  for (let i = 0; i < 80; i++) {
    const el = document.createElement('div');
    el.className = 'confetti-piece';
    const color = colors[Math.floor(Math.random() * colors.length)];
    const isCircle = Math.random() > 0.5;
    el.style.cssText = `
      left:${Math.random()*100}%;
      background:${color};
      border-radius:${isCircle?'50%':'2px'};
      width:${6+Math.random()*8}px;
      height:${6+Math.random()*8}px;
      animation-duration:${1.5+Math.random()*2}s;
      animation-delay:${Math.random()*0.8}s;
    `;
    overlay.appendChild(el);
  }
  setTimeout(() => { overlay.classList.remove('show'); overlay.innerHTML = ''; }, 4000);
}
// ===== ストリーク（連続前日比プラス／マイナス）計算 =====
function calcStreak() {
  if (!DATA || !DATA.history || DATA.history.length < 2) return { count: 0, direction: null };
  const h = DATA.history;
  // 最新エントリから遡って連続方向を調べる
  const last = h[h.length - 1];
  const prev = h[h.length - 2];
  if (last.total == null || prev.total == null) return { count: 0, direction: null };
  const latestDir = last.total >= prev.total ? 1 : -1;
  let count = 1;
  for (let i = h.length - 2; i >= 1; i--) {
    if (h[i].total == null || h[i-1].total == null) break;
    const dir = h[i].total >= h[i-1].total ? 1 : -1;
    if (dir === latestDir) { count++; } else { break; }
  }
  return { count, direction: latestDir };
}


const fmtSigned = v => {

  return `<span class="money-val">${sign}¥${Math.abs(Number(v)).toLocaleString("ja-JP")}</span>`;
};
const fmtPct = v => v==null?"—":`${v>=0?"+":""}${Number(v).toFixed(2)}%`;
const col = v => v==null?"#94a3b8":v>=0?"#0d9488":"#e11d48";
const getMonth = d => { const p=d.split("/"); return `${p[0]}年${p[1]}月`; };
const parseDate = d => { const [y,m,day]=d.split("/"); return new Date(parseInt(y),parseInt(m)-1,parseInt(day)); };

  if(Math.abs(n)>=1e8) return `<span class="money-val">¥${(n/1e8).toFixed(1)}億</span>`;
  if(Math.abs(n)>=1e4) return `<span class="money-val">¥${Math.round(n/1e4).toLocaleString("ja-JP")}万</span>`;
  return `<span class="money-val">¥${n.toLocaleString("ja-JP")}</span>`;
};
const fmtCS = v => {
  if(v==null) return "—";
  const n = Number(v);
  const sign = n>=0?"+":"-";
  const abs = Math.abs(n);
  if(abs>=1e8) return `<span class="money-val">${sign}¥${(abs/1e8).toFixed(1)}億</span>`;
  if(abs>=1e4) return `<span class="money-val">${sign}¥${Math.round(abs/1e4).toLocaleString("ja-JP")}万</span>`;
  return `<span class="money-val">${sign}¥${abs.toLocaleString("ja-JP")}</span>`;
};
// プレーンテキスト版（Chart.js tooltip 等で使用）
const fmtRaw  = v => v==null?"—":`¥${Number(v).toLocaleString("ja-JP")}`;
const fmtCRaw = v => {
  if(v==null) return "—";
  const n = Number(v);
  if(Math.abs(n)>=1e8) return `¥${(n/1e8).toFixed(1)}億`;
  if(Math.abs(n)>=1e4) return `¥${Math.round(n/1e4).toLocaleString("ja-JP")}万`;

// ===== サマリー =====
function renderSummary(){
  const h=DATA.history,latest=h[h.length-1],first=h[0];
  const daysDiff = Math.max(1, Math.round((parseDate(latest.date)-parseDate(first.date))/86400000));
  const totalReturn = (latest.total - first.total) / first.total;

  // ① CAGR（複利年率成長率）
  const cagr = ((1 + totalReturn) ** (365 / daysDiff) - 1) * 100;

  // ② 移動平均ベース（直近30・60・90日の加重平均）
  function getReturnForDays(days) {
    if (h.length < 2) return null;
    const base = h[Math.max(0, h.length - 1 - days)];
    const ret = (latest.total - base.total) / base.total;
    const actualDays = Math.max(1, Math.round((parseDate(latest.date) - parseDate(base.date)) / 86400000));
    return ((1 + ret) ** (365 / actualDays) - 1) * 100;
  }
  const r30 = getReturnForDays(30);
  const r60 = getReturnForDays(60);
  const r90 = getReturnForDays(90);
  const validRs = [r30, r60, r90].filter(r => r != null);
  const maReturn = validRs.length > 0
    ? (r30 != null && r60 != null && r90 != null
      ? r30 * 0.5 + r60 * 0.3 + r90 * 0.2
      : validRs.reduce((a,b)=>a+b,0) / validRs.length)
    : cagr;

  // ③ ボラティリティ調整済み（日次リターンの平均と標準偏差から計算）
  const dailyReturns = h.slice(1).map((d, i) =>
    h[i].total > 0 ? (d.total - h[i].total) / h[i].total : 0
  );
  const meanDaily = dailyReturns.reduce((a,b)=>a+b,0) / dailyReturns.length;
  const variance = dailyReturns.reduce((a,b)=>a+(b-meanDaily)**2,0) / dailyReturns.length;
  const stdDaily = Math.sqrt(variance);
  // リスク調整後リターン = (平均日次リターン - 0.5×分散) × 365
  const volAdjReturn = ((meanDaily - 0.5 * variance) * 365) * 100;

  // 年末予測
  const today = new Date();
  const yearEnd = new Date(today.getFullYear(), 11, 31);
  const daysToYearEnd = Math.max(1, Math.round((yearEnd - today) / 86400000));

  function yearEndProj(annRate) {
    return Math.round(latest.total * (1 + annRate/100) ** (daysToYearEnd/365));
  }
  function proj1y(annRate) {
    return Math.round(latest.total * (1 + annRate/100));
  }

  const rsData=h.find(d=>d.date===rangeStart),reData=h.find(d=>d.date===rangeEnd);
  const rChange=rsData&&reData?reData.total-rsData.total:null;
  const rPct=rsData&&rChange!=null?rChange/rsData.total*100:null;

  const dateList = h.map(d=>d.date);
  const years = [...new Set(dateList.map(d=>parseInt(d.split("/")[0])))].sort((a,b)=>a-b);

  function getAvailableMonths(year) {
    return [...new Set(dateList.filter(d=>parseInt(d.split("/")[0])===year).map(d=>parseInt(d.split("/")[1])))].sort((a,b)=>a-b);
  }
  function getAvailableDays(year, month) {
    return dateList.filter(d=>{const p=d.split("/");return parseInt(p[0])===year&&parseInt(p[1])===month;})
      .map(d=>parseInt(d.split("/")[2])).sort((a,b)=>a-b);
  }

  function datePickerHtml(pid, selected) {
    const [sy, sm, sd] = selected.split("/").map(Number);
    const availMonths = getAvailableMonths(sy);
    const availDays = getAvailableDays(sy, sm);
    return `<div class="date-picker">
      <div class="date-picker-label">${pid==="ps"?"開始日":"終了日"}</div>
      <div class="date-picker-selects">
        ${years.length>1?`<select onchange="onPickerChange('${pid}','y',this.value)">
          ${years.map(y=>`<option value="${y}"${y===sy?" selected":""}>${y}年</option>`).join("")}
        </select>`:""}
        <select id="${pid}-m" onchange="onPickerChange('${pid}','m',this.value)">
          ${availMonths.map(m=>`<option value="${m}"${m===sm?" selected":""}>${m}月</option>`).join("")}
        </select>
        <select id="${pid}-d" onchange="onPickerChange('${pid}','d',this.value)">
          ${availDays.map(d=>`<option value="${d}"${d===sd?" selected":""}>${d}日</option>`).join("")}
        </select>
      </div>
    </div>`;
  }

  // ATH計算
  const ath = calcATH();
  const isATH = ath != null && latest.total != null && latest.total >= ath;
  const athDiff = ath != null && latest.total != null ? ath - latest.total : null;
  const athDiffPct = ath != null && latest.total != null ? (ath - latest.total) / ath * 100 : null;
  const athBadgeHtml = isATH
    ? `<div style="display:inline-flex;align-items:center;gap:4px;background:linear-gradient(135deg,#fef3c7,#fbbf24);border:1px solid #fbbf24;border-radius:20px;padding:2px 10px;margin-top:6px">
        <span style="font-size:13px">🏆</span><span style="font-size:11px;font-weight:800;color:#92400e">ATH 更新中！</span>
       </div>`
    : athDiff != null
    ? `<div style="font-size:11px;color:#94a3b8;margin-top:5px">
        🏆 ATHまで <strong style="color:#f59e0b">${fmt(Math.round(athDiff))}</strong>
        <span style="color:#f59e0b">&nbsp;(${athDiffPct.toFixed(2)}%)</span>
       </div>`
    : '';

  // ストリーク計算
  const streak = calcStreak();
  const streakBadgeHtml = (() => {
    if (streak.count < 2 || streak.direction === null) return '';
    const n = streak.count;
    if (streak.direction === 1) {
      // 連続上昇：炎の強さを段階的に
      const fireEmojis = n >= 7 ? '🔥🔥🔥' : n >= 5 ? '🔥🔥' : '🔥';
      const label = n >= 7
        ? `${n}日連続爆上げ🚀 神ってる…`
        : n >= 5
        ? `${n}日連続増 強すぎ！`
        : `${n}日連続増`;
      const intensity = n >= 7
        ? 'background:linear-gradient(135deg,#fef08a,#fbbf24,#f97316);color:#7c2d12;border:1.5px solid #f97316;'
        : n >= 5
        ? 'background:linear-gradient(135deg,#fef3c7,#fde68a);color:#92400e;border:1.5px solid #fbbf24;'
        : 'background:linear-gradient(135deg,#fff7ed,#fed7aa);color:#9a3412;border:1.5px solid #fdba74;';
      return `<div class="streak-badge" style="${intensity}">
        <span class="streak-fire">${fireEmojis}</span>
        <span>+${n} Days Streak！${label}</span>
      </div>`;
    } else {
      // 連続下落：氷結アイコン
      const iceEmojis = n >= 7 ? '🧊🧊🧊' : n >= 5 ? '🧊🧊' : '🧊';
      const label = n >= 7
        ? `${n}日連続おんぎぃぃぃ…完全氷結`
        : n >= 5
        ? `${n}日連続おんぎぃ…つらい`
        : `${n}日連続おんぎぃ`;
      const intensity = n >= 7
        ? 'background:linear-gradient(135deg,#bfdbfe,#93c5fd,#60a5fa);color:#1e3a5f;border:1.5px solid #3b82f6;'
        : n >= 5
        ? 'background:linear-gradient(135deg,#dbeafe,#bfdbfe);color:#1e40af;border:1.5px solid #93c5fd;'
        : 'background:linear-gradient(135deg,#eff6ff,#dbeafe);color:#1e40af;border:1.5px solid #bfdbfe;';
      return `<div class="streak-badge" style="${intensity}">
        <span class="streak-ice">${iceEmojis}</span>
        <span>-${n} Days Streak… ${label}</span>
      </div>`;
    }
  })();

  document.getElementById('summaryCards').innerHTML=`
    <div class="card">
      <div class="card-label">最新評価額（${latest.date}）</div>
      <div style="font-size:17px;font-weight:800;color:#1e3a5f">${fmt(latest.total)}</div>
      ${athBadgeHtml}
      ${streakBadgeHtml}
    </div>
    <div class="card" style="background:linear-gradient(135deg,#ecfdf5,#d1fae5);border-color:#6ee7b7">
      <div class="card-label">含み益（${latest.date}）</div>
      <div style="font-size:15px;font-weight:800;color:#0d9488">${fmtSigned(latest.pnl)}</div>
      <div style="font-size:12px;color:#0d9488">${fmtPct(latest.pnlPct)}</div>
    </div>
    <div class="card full">
      <div class="card-label" style="font-weight:600;margin-bottom:10px">📅 期間変化（日付指定）</div>
      <div style="display:flex;gap:10px;align-items:center;margin-bottom:12px">
        ${datePickerHtml("ps", rangeStart)}
        <div style="color:#94a3b8;font-size:18px;flex-shrink:0;padding-top:20px">→</div>
        ${datePickerHtml("pe", rangeEnd)}
      </div>
      <div id="rangeResult">
      ${(()=>{
        const pnlC = rsData&&reData&&rsData.pnl!=null&&reData.pnl!=null ? reData.pnl-rsData.pnl : null;
        const firstCost = rsData&&rsData.pnl!=null ? rsData.total-rsData.pnl : null;
        const pnlCpct = pnlC!=null&&firstCost>0 ? pnlC/firstCost*100 : null;
        return rChange!=null?`<div style="display:flex;gap:16px;flex-wrap:wrap">
          <div><div class="card-label">評価額変化</div><div style="font-size:18px;font-weight:800;color:${col(rChange)}">${fmtSigned(rChange)}</div></div>
          <div><div class="card-label">変化率</div><div style="font-size:18px;font-weight:800;color:${col(rPct)}">${fmtPct(rPct)}</div></div>
          ${pnlC!=null?`<div><div class="card-label">含み益変化</div><div style="font-size:18px;font-weight:800;color:${col(pnlC)}">${fmtSigned(pnlC)}</div></div>`:""}
          ${pnlCpct!=null?`<div><div class="card-label">資産成長率</div><div style="font-size:18px;font-weight:800;color:${col(pnlCpct)}">${fmtPct(pnlCpct)}</div></div>`:""}
          <div><div class="card-label">開始時評価額</div><div style="font-size:13px;font-weight:600;color:#64748b">${fmt(rsData?.total)}</div></div>
        </div>`:'<div style="font-size:12px;color:#94a3b8">同じ日付が選択されています</div>';
      })()}
      </div>
    </div>
    <div class="card full" style="background:linear-gradient(135deg,#ede9fe,#ddd6fe);border-color:#c4b5fd">
      <div style="font-size:10px;color:#7c3aed;font-weight:700;letter-spacing:2px;margin-bottom:10px">📈 年率リターン予測（3手法比較・参考値）</div>
      <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:12px">

          <div style="font-size:9px;color:${returnMethod===key?"#e9d5ff":"#7c3aed"};font-weight:700;margin-bottom:2px">${label}</div>
          <div style="font-size:9px;color:${returnMethod===key?"#ddd6fe":"#a78bfa"};margin-bottom:6px">${sub}</div>
          <div style="font-size:18px;font-weight:900;color:${returnMethod===key?"#fff":col(val)}">${val>=0?"+":""}${val.toFixed(1)}%</div>
        </div>`).join("")}
      </div>
      <div style="border-top:1px solid #c4b5fd;padding-top:10px">
        <div style="font-size:10px;color:#7c3aed;font-weight:700;margin-bottom:8px">年末（12/31）・1年後の評価額予測</div>
        <table style="width:100%;font-size:11px;border-collapse:collapse">

              <th style="text-align:right;color:#a78bfa;font-weight:600;padding:4px 0">年末（残${daysToYearEnd}日）</th>
              <th style="text-align:right;color:#a78bfa;font-weight:600;padding:4px 0">1年後</th>
            </tr>
          </thead>
          <tbody>
            ${[["cagr","① CAGR",cagr],["ma","② 移動平均",maReturn],["vol","③ ボラ調整",volAdjReturn]].map(([key,label,val])=>`
            <tr style="border-bottom:1px solid rgba(196,181,253,0.3);background:${returnMethod===key?"rgba(109,40,217,0.08)":"transparent"}">
              <td style="color:#7c3aed;padding:5px 0;font-weight:${returnMethod===key?"800":"400"}">${label}${returnMethod===key?" ✓":""}</td>

            </tr>`).join("")}
          </tbody>
        </table>

        <div style="font-size:10px;color:#7c3aed;font-weight:700;margin-top:14px;margin-bottom:8px">ファンド別 現在の損益・年末・1年後予測</div>
        <table style="width:100%;font-size:11px;border-collapse:collapse">
          <thead>
            <tr style="border-bottom:1px solid #c4b5fd">
              <th style="text-align:left;color:#a78bfa;font-weight:600;padding:4px 0">ファンド</th>
              <th style="text-align:right;color:#a78bfa;font-weight:600;padding:4px 0">現在の評価額</th>
              <th style="text-align:right;color:#a78bfa;font-weight:600;padding:4px 0">年末</th>
              <th style="text-align:right;color:#a78bfa;font-weight:600;padding:4px 0">1年後</th>
            </tr>
          </thead>
          <tbody>
        ${DATA.funds.map(f => {
              const fvalid = f.data.filter(d=>d.pnlPct!=null);
              const flast = fvalid[fvalid.length-1];
              const ffirst = fvalid[0];
              if (!flast || !ffirst || !f.units || !f.cost_nav) return "";
              const fDays = Math.max(1, Math.round((parseDate(flast.date)-parseDate(ffirst.date))/86400000));
              // pnlPctから各時点の相対価値を計算
              // nav = cost_nav × (1 + pnlPct/100)
              const firstNav = f.cost_nav * (1 + ffirst.pnlPct/100);
              const lastNav  = f.cost_nav * (1 + flast.pnlPct/100);
              const fTotalReturn = (lastNav - firstNav) / firstNav;
              let fRate;
              if (returnMethod === "cagr") {
                fRate = ((1 + fTotalReturn) ** (365/fDays) - 1) * 100;
              } else if (returnMethod === "ma") {
                const getR = (days) => {
                  const base = fvalid[Math.max(0, fvalid.length-1-days)];
                  if (!base) return null;
                  const baseNav = f.cost_nav * (1 + base.pnlPct/100);
                  const r = (lastNav - baseNav) / baseNav;
                  const d2 = Math.max(1, Math.round((parseDate(flast.date)-parseDate(base.date))/86400000));
                  return ((1+r)**(365/d2)-1)*100;
                };
                const rs = [getR(30),getR(60),getR(90)].filter(r=>r!=null);
                fRate = rs.length===3 ? rs[0]*0.5+rs[1]*0.3+rs[2]*0.2 : rs.length>0 ? rs.reduce((a,b)=>a+b,0)/rs.length : 0;

                const navSeries = fvalid.map(d => f.cost_nav * (1 + d.pnlPct/100));
                const fDailyR = navSeries.slice(1).map((n,i)=>(n-navSeries[i])/navSeries[i]);
                const fMean = fDailyR.reduce((a,b)=>a+b,0)/fDailyR.length;
                const fVar = fDailyR.reduce((a,b)=>a+(b-fMean)**2,0)/fDailyR.length;
                fRate = (fMean - 0.5*fVar)*365*100;
              }
              const evalNow = Math.round(f.units * lastNav / 10000);
              const costNow = Math.round(f.units * f.cost_nav / 10000);
              const pnlNow  = evalNow - costNow;
              const fYearEnd = Math.round(evalNow * (1+fRate/100)**(daysToYearEnd/365));

                <td style="text-align:right;font-weight:700;color:#4c1d95;padding:5px 0">${fmt(f1y)}</td>

// ===== ドーナツチャート（ファンド選択可能） =====
function renderDonutChart(){
  const legendEl = document.getElementById('donutLegend');
  if(!legendEl) return;

  const evalsAll = DATA.funds.map(f=>{
    const last = f.data.filter(d=>d.pnlPct!=null).slice(-1)[0];
    const nav = last && f.cost_nav ? f.cost_nav*(1+last.pnlPct/100) : 0;
    return f.units && nav ? Math.round(f.units*nav/10000) : 0;
  });
  const includedTotal = DATA.funds.reduce((sum,f,i)=> donutExcluded.has(f.short) ? sum : sum+evalsAll[i], 0);

  legendEl.innerHTML = DATA.funds.map((f,i)=>{
    const excluded = donutExcluded.has(f.short);
    const pct = (!excluded && evalsAll[i] && includedTotal) ? (evalsAll[i]/includedTotal*100).toFixed(1) : "—";
    return `<div class="legend-item" onclick="toggleDonutFund('${f.short}')" style="cursor:pointer;user-select:none;opacity:${excluded?0.4:1}">
      <span style="display:inline-flex;align-items:center;justify-content:center;width:13px;height:13px;border-radius:3px;border:1.5px solid ${f.color};background:${excluded?'transparent':f.color};font-size:9px;color:#fff;line-height:1">${excluded?'':'✓'}</span>
      <div class="legend-line" style="background:${f.color}"></div>${f.short}${excluded?"":` ${pct}%`}
    </div>`;
  }).join("");

  const ctx = document.getElementById('donutChart')?.getContext('2d');
  if (!ctx) return;
  destroyChart('donut');
  const labels = [], data = [], colors = [];
  DATA.funds.forEach((f,i)=>{
    if(donutExcluded.has(f.short)) return;
    labels.push(f.short); data.push(evalsAll[i]); colors.push(f.color);
  });
  charts['donut'] = new Chart(ctx,{
    type:'doughnut',
    data:{ labels, datasets:[{data, backgroundColor:colors, borderColor:'#fff', borderWidth:2}] },
    options:{responsive:true, maintainAspectRatio:false,
      plugins:{legend:{display:false},
        tooltip:{callbacks:{label:c=>`${c.label}：${fmtRaw(c.raw)}（${(c.raw/data.reduce((a,b)=>a+b,0)*100).toFixed(1)}%）`}}
      }
    }
  });
}
function toggleDonutFund(short){
  if(donutExcluded.has(short)){
    donutExcluded.delete(short);
  } else {
    // 全ファンド除外は不可（最低1件は表示）
    if(DATA.funds.length - donutExcluded.size <= 1) return;
    donutExcluded.add(short);
  }
  renderDonutChart();
}

function renderTotal(){

    const globalIdx = h.findIndex(x => x.date === d.date);

    const dayChangePct = prevGlobal && d.total && prevGlobal.total
      ? ((d.total - prevGlobal.total) / prevGlobal.total * 100) : null;
    const dayChangeAmt = prevGlobal && d.pnl != null && prevGlobal.pnl != null
      ? (d.pnl - prevGlobal.pnl) : null;
    const dayChangePnlPct = prevGlobal && d.pnl != null && prevGlobal.pnl != null && prevGlobal.pnl !== 0
      ? ((d.pnl - prevGlobal.pnl) / Math.abs(prevGlobal.pnl) * 100) : null;
    const dayChangeVal = dayChangeMode === "pct" ? dayChangePct : dayChangeMode === "pnlPct" ? dayChangePnlPct : dayChangeAmt;

  document.getElementById('tabContent').innerHTML=`

// データ数に応じてドットサイズを自動調整
function dotSize(n){ return n > 60 ? 0 : n > 30 ? 1.5 : n > 15 ? 2.5 : 3.5; }

function buildMainChart(){
  const h = totalMonthTab === "all" ? DATA.history : DATA.history.filter(d => getMonth(d.date) === totalMonthTab);
  const isPct = metric === "pnlPct";
  const showCost = metric === "total"; // 評価額表示のときだけ元本を表示
  const ctx = document.getElementById('mainChart')?.getContext('2d'); if(!ctx)return;
  const r = dotSize(h.length);
  destroyChart('main');

  const datasets = [{
    label: "評価額",
    data: h.map(d => d[metric]),
    borderColor: '#3b82f6',
    backgroundColor: 'rgba(59,130,246,0.08)',
    borderWidth: 2,
    pointRadius: r, pointHoverRadius: r+2,
    pointBackgroundColor: '#3b82f6',
    tension: 0.3, fill: true, order: 1,
  }];

  if (showCost) {
    datasets.push({
      label: "投資元本",
      data: h.map(d => (d.total != null && d.pnl != null) ? d.total - d.pnl : null),
      borderColor: '#94a3b8',
      backgroundColor: 'transparent',
      borderWidth: 1.5,
      borderDash: [4, 4],
      pointRadius: 0,
      tension: 0.3, fill: false, order: 2,
      spanGaps: true,
    });
  }

  // SMA（巡航速度）追加：評価額表示のときのみ
  if (showCost && showSMA) {
    const globalH = DATA.history;
    const calcSMA = (n) => h.map((pt) => {
      const gIdx = globalH.findIndex(d => d.date === pt.date);
      const slice = globalH.slice(Math.max(0, gIdx - n + 1), gIdx + 1).map(d => d.total).filter(v => v != null);
      return slice.length >= Math.min(n, 5) ? slice.reduce((a,b)=>a+b,0)/slice.length : null;
    });
    datasets.push({
      label: "30日MA",
      data: calcSMA(30),
      borderColor: '#f97316',
      backgroundColor: 'transparent',
      borderWidth: 2,
      pointRadius: 0,
      tension: 0.4, fill: false, order: 3,
      spanGaps: true,
    });
    datasets.push({
      label: "90日MA",
      data: calcSMA(90),
      borderColor: '#8b5cf6',
      backgroundColor: 'transparent',
      borderWidth: 2,
      borderDash: [6, 3],
      pointRadius: 0,
      tension: 0.4, fill: false, order: 4,
      spanGaps: true,
    });
  }

  charts['main'] = new Chart(ctx, {type:'line',
    data: { labels: h.map(d=>d.date), datasets },
    options: { responsive:true, maintainAspectRatio:false,
      plugins: {
        legend: { display: (showCost || (showCost && showSMA)), labels: { color:'#64748b', font:{size:11}, boxWidth:20, padding:12, filter: item => ['投資元本','30日MA','90日MA'].includes(item.text) ? false : true }},
        tooltip: { callbacks: { label: c => `${c.dataset.label}：${isPct?fmtPct(c.raw):fmtRaw(c.raw)}` }}
      },
      scales: {
        x: { grid:{color:'#bfdbfe'}, ticks:{color:'#94a3b8',font:{size:10},maxTicksLimit:10} },
        y: { grid:{color:'#bfdbfe'}, ticks:{color:'#94a3b8',font:{size:10},
          callback: v => isPct ? `${v}%` : (_stealthMode ? '¥ ****' : `¥${(v/1e6).toFixed(1)}M`)}}
      }
    }
  });
}

    <div class="card" style="border-radius:16px;margin-bottom:12px">
      <div style="font-size:12px;color:#64748b;margin-bottom:8px">${monthTab} 評価額推移</div>
      <div class="chart-wrap"><canvas id="monthChart"></canvas></div>
    </div>
    <div class="card" style="border-radius:16px;margin-bottom:12px">
      <div style="font-size:12px;color:#64748b;margin-bottom:2px">${monthTab} ファンド別騰落率（月初比）</div>
      <div style="font-size:11px;color:#94a3b8;margin-bottom:8px">月初を0%として月内の変動を表示</div>
      <div class="chart-wrap"><canvas id="mFundsChart"></canvas></div>
      <div class="legend">${DATA.funds.map(f=>`<div class="legend-item"><div class="legend-line" style="background:${f.color}"></div>${f.short}</div>`).join("")}</div>
    </div>`;
  buildMonthChart(mData); buildMFundsChart(mFunds);
}
function switchMonth(m){monthTab=m;destroyChart('month');destroyChart('mfunds');renderMonthly();}
function switchMonthYear(y){
  const months=getMonths();
  const firstInYear=months.find(m=>m.startsWith(y+"年"));
  if(firstInYear){monthTab=firstInYear;destroyChart('month');destroyChart('mfunds');renderMonthly();}
}
function switchReturnMethod(m){returnMethod=m;renderSummary();}
function switchMonthSort(order){monthSortOrder=order;renderMonthly();}
function switchFundsSort(order){monthSortOrder=order;renderFunds();}
function buildMonthChart(mData){
  const ctx=document.getElementById('monthChart')?.getContext('2d'); if(!ctx||mData.length<2)return;
  const r=dotSize(mData.length);
  destroyChart('month');
  charts['month']=new Chart(ctx,{type:'line',
    data:{labels:mData.map(d=>d.date),datasets:[{data:mData.map(d=>d.total),borderColor:'#3b82f6',
      backgroundColor:'rgba(59,130,246,0.08)',borderWidth:2,pointRadius:r,pointHoverRadius:r+2,pointBackgroundColor:'#3b82f6',tension:0.3,fill:true}]},
    options:{responsive:true,maintainAspectRatio:false,
      plugins:{legend:{display:false},tooltip:{callbacks:{label:c=>fmtRaw(c.raw)}}},
      scales:{x:{grid:{color:'#bfdbfe'},ticks:{color:'#94a3b8',font:{size:10},maxTicksLimit:10}},
        y:{grid:{color:'#bfdbfe'},ticks:{color:'#94a3b8',font:{size:10},callback:v=>_stealthMode?'¥ ****':`¥${(v/1e6).toFixed(2)}M`}}}}});
}
function buildMFundsChart(mFunds){
  const ctx=document.getElementById('mFundsChart')?.getContext('2d'); if(!ctx)return;
  const n=mFunds[0]?.data.length||0; const r=dotSize(n);
  destroyChart('mfunds');
  const labels=mFunds[0]?.data.map(d=>d.date)||[];
  charts['mfunds']=new Chart(ctx,{type:'line',
    data:{labels,datasets:mFunds.map(f=>{
      const base=f.data.find(d=>d.pnlPct!=null)?.pnlPct??0;
      return{label:f.short,borderColor:f.color,backgroundColor:'transparent',borderWidth:2,
        pointRadius:r,pointHoverRadius:r+2,pointBackgroundColor:f.color,tension:0.3,spanGaps:true,
        data:f.data.map(d=>d.pnlPct!=null?parseFloat((d.pnlPct-base).toFixed(2)):null)};
    })},
    options:{responsive:true,maintainAspectRatio:false,
      plugins:{legend:{display:false},tooltip:{callbacks:{label:c=>`${c.dataset.label}：${fmtPct(c.raw)}`}}},
      scales:{x:{grid:{color:'#bfdbfe'},ticks:{color:'#94a3b8',font:{size:10},maxTicksLimit:10}},
        y:{grid:{color:'#bfdbfe'},ticks:{color:'#94a3b8',font:{size:10},callback:v=>`${v>0?"+":""}${v.toFixed(1)}%`}}}}});
}

// ===== ファンド別 =====
function renderFunds(){
  const months = getMonths();
  const isMonth = fundsView !== "total";

  // ファンドデータ取得＋ソート
  let fundList = DATA.funds.map(f => {
    const v = fundsView === "total"
      ? f.data.filter(d=>d.pnlPct!=null)
      : f.data.filter(d=>getMonth(d.date)===fundsView&&d.pnlPct!=null);
    const lf = v[v.length-1], ff = v[0];
    const diff = lf && ff ? lf.pnlPct - ff.pnlPct : null;
    // 月間損益（口数×（月末nav - 月初nav）/10000）
    const lastNav  = lf  && f.cost_nav ? f.cost_nav*(1+lf.pnlPct/100)  : null;
    const firstNav = ff  && f.cost_nav ? f.cost_nav*(1+ff.pnlPct/100)  : null;
    const monthPnl = f.units && lastNav && firstNav ? Math.round(f.units*(lastNav-firstNav)/10000) : null;
    const curPnl   = f.units && f.cost_nav && lastNav ? Math.round(f.units*(lastNav-f.cost_nav)/10000) : null;

    // ドローダウン計算（全データの最高pnlPctからの下落率）
    const allValid = f.data.filter(d=>d.pnlPct!=null);
    const maxPnlPct = allValid.length ? Math.max(...allValid.map(d=>d.pnlPct)) : null;
    const maxDate = maxPnlPct!=null ? allValid.find(d=>d.pnlPct===maxPnlPct)?.date : null;
    const currentPnlPct = lf?.pnlPct ?? null;
    // ドローダウン = (現在価値 - 最高値) / 最高値 × 100
    const maxNav = maxPnlPct!=null && f.cost_nav ? f.cost_nav*(1+maxPnlPct/100) : null;
    const curNav = currentPnlPct!=null && f.cost_nav ? f.cost_nav*(1+currentPnlPct/100) : null;
    const drawdown = maxNav && curNav ? ((curNav - maxNav) / maxNav * 100) : null;
    // アラートレベル
    const ddAbs = drawdown!=null ? Math.abs(drawdown) : 0;
    const ddAlert = ddAbs >= 30 ? {level:"🔴 -30%超！", color:"#dc2626", bg:"rgba(220,38,38,0.08)"}
                  : ddAbs >= 20 ? {level:"🟠 -20%超", color:"#ea580c", bg:"rgba(234,88,12,0.08)"}
                  : ddAbs >= 10 ? {level:"🟡 -10%超", color:"#ca8a04", bg:"rgba(202,138,4,0.08)"}
                  : null;

    return { f, lf, ff, diff, monthPnl, curPnl, drawdown, maxPnlPct, maxDate, ddAlert };
  });

  if (monthSortOrder==="desc") fundList.sort((a,b)=>(b.lf?.pnlPct??-999)-(a.lf?.pnlPct??-999));
  else if (monthSortOrder==="asc") fundList.sort((a,b)=>(a.lf?.pnlPct??999)-(b.lf?.pnlPct??999));

  const fundCards = fundList.map(({f, lf, diff, monthPnl, curPnl, drawdown, maxPnlPct, maxDate, ddAlert}) => {
    const ddStr = drawdown!=null ? (drawdown>=0?"±0":drawdown.toFixed(2)+"%") : "—";
    const ddColor = drawdown!=null && drawdown < 0 ? "#e11d48" : "#0d9488";

    // ── 機能1: 平均取得単価ライン ──
    // 現在の基準価額 vs コスト基準価額の距離感を計算
    const curNav = lf && f.cost_nav ? f.cost_nav*(1+lf.pnlPct/100) : null;
    const costNav = f.cost_nav || null;
    let costGapPct = null, costGapStr = "", costBadge = "";
    if (curNav && costNav) {
      costGapPct = (curNav - costNav) / costNav * 100;
      costGapStr = `${costGapPct>=0?"+":""}${costGapPct.toFixed(2)}%`;
      const aboveBelow = costGapPct >= 0 ? "上" : "下";
      const badgeColor = costGapPct >= 0 ? "#0d9488" : "#e11d48";
      const badgeBg   = costGapPct >= 0 ? "#ecfdf5" : "#fff1f2";
      costBadge = `<div style="display:inline-flex;align-items:center;gap:4px;background:${badgeBg};border:1px solid ${badgeColor}40;border-radius:20px;padding:2px 10px;font-size:11px;font-weight:800;color:${badgeColor}">
        ${costGapPct>=0?"✅":"⚠️"} コスト比 ${costGapStr} ${aboveBelow}
      </div>`;
    }

    // ── 機能2: SMAクロス & RSI バッジ（ファンド個別） ──
    const allValid = f.data.filter(d=>d.pnlPct!=null);
    let smaBadge = "", rsiBadge = "";
    if (allValid.length >= 20) {
      const navSeries = allValid.map(d => f.cost_nav*(1+d.pnlPct/100));
      const avg = (arr, n) => arr.length>=n ? arr.slice(-n).reduce((a,b)=>a+b,0)/n : null;
      const sma5  = avg(navSeries, 5);
      const sma20 = avg(navSeries, 20);
      const prevSma5  = navSeries.length>=6  ? navSeries.slice(-6,-1).reduce((a,b)=>a+b,0)/5  : null;
      const prevSma20 = navSeries.length>=21 ? navSeries.slice(-21,-1).reduce((a,b)=>a+b,0)/20 : null;
      if (sma5!=null && sma20!=null && prevSma5!=null && prevSma20!=null) {
        const isGolden = prevSma5<=prevSma20 && sma5>sma20;
        const isDead   = prevSma5>=prevSma20 && sma5<sma20;
        const isBullish = sma5 > sma20;
        if (isGolden)      smaBadge = `<span style="background:#ecfdf5;border:1px solid #6ee7b7;border-radius:20px;padding:2px 8px;font-size:10px;font-weight:800;color:#059669">🌟 ゴールデンクロス</span>`;
        else if (isDead)   smaBadge = `<span style="background:#fff1f2;border:1px solid #fca5a5;border-radius:20px;padding:2px 8px;font-size:10px;font-weight:800;color:#dc2626">💀 デッドクロス</span>`;
        else if (isBullish) smaBadge = `<span style="background:#eff6ff;border:1px solid #bfdbfe;border-radius:20px;padding:2px 8px;font-size:10px;font-weight:700;color:#2563eb">📈 上昇トレンド中</span>`;
        else                smaBadge = `<span style="background:#fff7ed;border:1px solid #fed7aa;border-radius:20px;padding:2px 8px;font-size:10px;font-weight:700;color:#c2410c">📉 下落トレンド中</span>`;
      }
      // 簡易RSI(14日)
      if (navSeries.length >= 15) {
        const changes = navSeries.slice(-15).slice(1).map((v,i)=>v-navSeries.slice(-15)[i]);
        const gains = changes.filter(c=>c>0).reduce((a,b)=>a+b,0)/14;
        const losses = Math.abs(changes.filter(c=>c<0).reduce((a,b)=>a+b,0))/14;
        const rs = losses===0 ? 100 : gains/losses;
        const rsi = 100 - 100/(1+rs);
        const rsiInt = Math.round(rsi);
        let rsiLabel, rsiColor, rsiBg;
        if (rsiInt >= 70)      { rsiLabel="🔥 過熱気味"; rsiColor="#dc2626"; rsiBg="#fff1f2"; }
        else if (rsiInt >= 55) { rsiLabel="📈 やや強め"; rsiColor="#0d9488"; rsiBg="#ecfdf5"; }
        else if (rsiInt >= 45) { rsiLabel="➡️ 中立"; rsiColor="#64748b"; rsiBg="#f1f5f9"; }
        else if (rsiInt >= 30) { rsiLabel="📉 やや弱め"; rsiColor="#ea580c"; rsiBg="#fff7ed"; }
        else                   { rsiLabel="💙 バーゲン域"; rsiColor="#7c3aed"; rsiBg="#f5f3ff"; }
        rsiBadge = `<span style="background:${rsiBg};border:1px solid ${rsiColor}40;border-radius:20px;padding:2px 8px;font-size:10px;font-weight:700;color:${rsiColor}">RSI ${rsiInt} ${rsiLabel}</span>`;
      }
    }

    return `<div class="fund-card" style="border-left:3px solid ${f.color};${ddAlert?`background:${ddAlert.bg};`:""}">
      <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px">
        <div style="font-size:13px;font-weight:700">${f.name}</div>
        ${ddAlert ? `<div style="font-size:11px;font-weight:800;color:${ddAlert.color};background:white;padding:2px 8px;border-radius:20px;border:1px solid ${ddAlert.color};white-space:nowrap">${ddAlert.level} 買い増しチャンス！</div>` : ""}
      </div>
      <div class="fund-stats">
        <div><div class="card-label">${fundsView==="total"?"最新":"月末"}損益率</div><div style="font-size:17px;font-weight:800;color:${col(lf?.pnlPct)}">${fmtPct(lf?.pnlPct)}</div></div>
        <div><div class="card-label">${isMonth?"月内変化":"期間変化"}</div><div style="font-size:15px;font-weight:700;color:${col(diff)}">${diff!=null?(diff>=0?"+":"")+diff.toFixed(2)+"%":"—"}</div></div>
        ${isMonth && monthPnl!=null ? `<div><div class="card-label">月間損益</div><div style="font-size:15px;font-weight:700;color:${col(monthPnl)}">${fmtSigned(monthPnl)}</div></div>` : ""}
        ${curPnl!=null ? `<div><div class="card-label">含み益</div><div style="font-size:15px;font-weight:700;color:${col(curPnl)}">${fmtSigned(curPnl)}</div></div>` : ""}
        <div><div class="card-label">基準価額</div><div style="font-size:13px;font-weight:600;color:#64748b">${fmt(lf?.nav)}</div></div>
        <div><div class="card-label">最高値比（DD）</div><div style="font-size:13px;font-weight:700;color:${ddColor}">${ddStr}${maxDate?`<span style="font-size:10px;color:#94a3b8;margin-left:4px">最高:${maxDate}</span>`:""}</div></div>
      </div>
      ${costBadge ? `<div style="margin-top:10px;border-top:1px solid #f1f5f9;padding-top:8px">
        <div style="font-size:10px;color:#94a3b8;margin-bottom:6px;font-weight:700">🎯 コスト比・テクニカル</div>
        <div style="display:flex;flex-wrap:wrap;gap:5px;align-items:center">
          ${costBadge}
          ${smaBadge}
          ${rsiBadge}
        </div>
      </div>` : ""}
      ${f.cost_nav && allValid.length >= 2 ? `<div style="margin-top:10px;border-top:1px solid #f1f5f9;padding-top:8px">
        <div style="font-size:10px;color:#94a3b8;margin-bottom:4px;font-weight:700">📊 基準価額 vs 平均取得単価</div>
        <div style="position:relative;height:100px"><canvas id="fundMiniChart_${f.short.replace(/[^a-zA-Z0-9]/g,'_')}"></canvas></div>
        <div style="display:flex;gap:12px;margin-top:4px">
          <div style="display:flex;align-items:center;gap:4px;font-size:10px;color:#64748b"><div style="width:12px;height:2px;background:${f.color};border-radius:2px"></div>基準価額</div>
          <div style="display:flex;align-items:center;gap:4px;font-size:10px;color:#f59e0b"><div style="width:12px;height:2px;background:#f59e0b;border-radius:2px;border-top:1px dashed #f59e0b"></div>平均取得単価</div>
        </div>
      </div>` : ""}
    </div>`;
  }).join("");

  const displayFunds = fundsView==="total"
    ? DATA.funds
    : DATA.funds.map(f=>({...f,data:f.data.filter(d=>getMonth(d.date)===fundsView)}));

  document.getElementById('tabContent').innerHTML=`
    <div class="tabs">
      <button class="tab${fundsView==="total"?" active":""}" onclick="switchFundsView('total')">全期間</button>
      ${months.map(m=>`<button class="tab${fundsView===m?" active":""}" onclick="switchFundsView('${m}')">${m}</button>`).join("")}
    </div>
    <div class="card" style="border-radius:16px;margin-bottom:12px">
      <div style="font-size:12px;color:#64748b;margin-bottom:8px">${fundsView==="total"?"全期間":fundsView} 損益率推移（%）</div>
      <div class="chart-wrap"><canvas id="fundsChart"></canvas></div>
      <div class="legend">${DATA.funds.map(f=>`<div class="legend-item"><div class="legend-line" style="background:${f.color}"></div>${f.short}</div>`).join("")}</div>
    </div>
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px">
      <div style="font-size:12px;color:#64748b;font-weight:600">ファンド別</div>
      <div style="display:flex;gap:6px">
        <button class="mbtn${monthSortOrder==='none'?' active':''}" onclick="switchFundsSort('none')">デフォルト</button>
        <button class="mbtn${monthSortOrder==='desc'?' active':''}" onclick="switchFundsSort('desc')">高い順▼</button>
        <button class="mbtn${monthSortOrder==='asc'?' active':''}" onclick="switchFundsSort('asc')">低い順▲</button>
      </div>
    </div>
    ${fundCards}`;
  buildFundsChart(displayFunds);
  // ── 機能1: ミニチャート（基準価額 vs 平均取得単価ライン）描画 ──
  setTimeout(() => {
    DATA.funds.forEach(f => {
      if (!f.cost_nav) return;
      const allValid = f.data.filter(d=>d.pnlPct!=null);
      if (allValid.length < 2) return;
      const canvasId = 'fundMiniChart_' + f.short.replace(/[^a-zA-Z0-9]/g,'_');
      const ctx2 = document.getElementById(canvasId)?.getContext('2d');
      if (!ctx2) return;
      const chartKey = 'mini_' + canvasId;
      if (charts[chartKey]) { charts[chartKey].destroy(); delete charts[chartKey]; }
      const navData = allValid.map(d => parseFloat((f.cost_nav*(1+d.pnlPct/100)).toFixed(1)));
      const labels2 = allValid.map(d => d.date);
      const costLine2 = allValid.map(() => f.cost_nav);
      const r2 = dotSize(navData.length);
      charts[chartKey] = new Chart(ctx2, {type:'line',
        data:{labels:labels2,datasets:[
          {label:'基準価額',data:navData,borderColor:f.color,backgroundColor:f.color+'15',
           borderWidth:2,pointRadius:r2,pointHoverRadius:r2+1,tension:0.3,fill:true,order:1},
          {label:'平均取得単価',data:costLine2,borderColor:'#f59e0b',backgroundColor:'transparent',
           borderWidth:1.5,borderDash:[5,3],pointRadius:0,tension:0,fill:false,order:2}
        ]},
        options:{responsive:true,maintainAspectRatio:false,
          plugins:{legend:{display:false},
            tooltip:{callbacks:{label:c=>`${c.dataset.label}：${fmtRaw(c.raw)}`}}},
          scales:{
            x:{display:false,grid:{display:false}},
            y:{grid:{color:'#f1f5f9'},ticks:{color:'#94a3b8',font:{size:9},maxTicksLimit:4,
              callback:v=>_stealthMode?'¥ ****':`¥${(v/1e4).toFixed(1)}万`}}
          }
        }
      });
    });
  }, 80);
}
function switchFundsView(v){fundsView=v;destroyChart('funds');renderFunds();}
function buildFundsChart(displayFunds){
  const ctx=document.getElementById('fundsChart')?.getContext('2d'); if(!ctx)return;
  destroyChart('funds');
  // 全ファンドの日付を統合した1本の時間軸を作る（開始日がずれているファンドを左端に詰めないため）

    })},

      plugins:{legend:{display:false},tooltip:{callbacks:{label:c=>`${c.dataset.label}：${fmtPct(c.raw)}`}}},
      scales:{x:{grid:{color:'#bfdbfe'},ticks:{color:'#94a3b8',font:{size:10},maxTicksLimit:10}},
        y:{grid:{color:'#bfdbfe'},ticks:{color:'#94a3b8',font:{size:10},callback:v=>`${v}%`}}}}});
}

// ===== 月・日ドロップダウン =====
function onPickerChange(pid, col, val) {
  const h = DATA.history;
  const dateList = h.map(d=>d.date);

  let current = pid === "ps" ? rangeStart : rangeEnd;
  let [cy, cm, cd] = current.split("/").map(Number);

  if (col === "y") {
    cy = parseInt(val);
    // その年の月リストを更新
    const availMonths = [...new Set(dateList.filter(d=>parseInt(d.split("/")[0])===cy).map(d=>parseInt(d.split("/")[1])))].sort((a,b)=>a-b);
    cm = availMonths.includes(cm) ? cm : availMonths[0];
    const monthEl = document.getElementById(`${pid}-m`);
    if (monthEl) {
      monthEl.innerHTML = availMonths.map(m=>`<option value="${m}">${m}月</option>`).join("");
      monthEl.value = cm;
    }
    const availDays = dateList.filter(d=>{const p=d.split("/");return parseInt(p[0])===cy&&parseInt(p[1])===cm;}).map(d=>parseInt(d.split("/")[2])).sort((a,b)=>a-b);
    cd = availDays.includes(cd) ? cd : availDays[0];
    const dayEl = document.getElementById(`${pid}-d`);
    if (dayEl) {
      dayEl.innerHTML = availDays.map(d=>`<option value="${d}">${d}日</option>`).join("");
      dayEl.value = cd;
    }
  } else if (col === "m") {
    cm = parseInt(val);
    // その年月の日リストを更新
    const availDays = dateList.filter(d=>{const p=d.split("/");return parseInt(p[0])===cy&&parseInt(p[1])===cm;}).map(d=>parseInt(d.split("/")[2])).sort((a,b)=>a-b);
    const dayEl = document.getElementById(`${pid}-d`);
    if (dayEl) {
      dayEl.innerHTML = availDays.map(d=>`<option value="${d}">${d}日</option>`).join("");
      cd = availDays.includes(cd) ? cd : availDays[0];
      dayEl.value = cd;
    }
  } else {
    cd = parseInt(val);
  }

  const newDate = `${cy}/${cm}/${cd}`;
  if (pid === "ps") rangeStart = newDate;
  else rangeEnd = newDate;
  updateRangeResult();
}

function updateRangeResult() {
  const h = DATA.history;
  const rsData = h.find(d=>d.date===rangeStart);
  const reData = h.find(d=>d.date===rangeEnd);
  const rChange = rsData&&reData ? reData.total-rsData.total : null;
  const rPct = rsData&&rChange!=null ? rChange/rsData.total*100 : null;
  const pnlC = rsData&&reData&&rsData.pnl!=null&&reData.pnl!=null ? reData.pnl-rsData.pnl : null;
  const firstCost = rsData&&rsData.pnl!=null ? rsData.total-rsData.pnl : null;
  const pnlCpct = pnlC!=null&&firstCost>0 ? pnlC/firstCost*100 : null;
  const el = document.getElementById('rangeResult');
  if (!el) return;
  el.innerHTML = rChange!=null ? `
    <div style="display:flex;gap:16px;flex-wrap:wrap">
      <div><div class="card-label">評価額変化</div><div style="font-size:18px;font-weight:800;color:${col(rChange)}">${fmtSigned(rChange)}</div></div>

function renderMilestones() {
  const h = DATA.history;
  const latest = h[h.length-1];
  const base = latest.total;
  const monthly = simMonthly || 10000;
  const rate = (simRate || 5) / 100;
  const mr = rate / 12;

  function monthsToReach(target) {
    if (base >= target) return 0;
    if (mr <= 0) {
      const m = Math.ceil((target - base) / monthly);
      return m > 0 ? m : null;
    }
    for (let n = 1; n <= 12 * 100; n++) {
      const v = base * (1 + mr) ** n + monthly * ((1 + mr) ** n - 1) / mr;
      if (v >= target) return n;
    }
    return null;
  }

  function monthsToDate(n) {
    const now = new Date();
    now.setMonth(now.getMonth() + n);
    return now;
  }

  function fmtDate(d) {
    return `${d.getFullYear()}年${d.getMonth()+1}月`;
  }

  function daysUntil(d) {
    return Math.max(0, Math.round((d - new Date()) / 86400000));
  }

  const milestones = [
    { label: "500万", value: 5000000, emoji: "🌱", color: "#10b981", bg: "#ecfdf5" },
    { label: "1,000万", value: 10000000, emoji: "🎯", color: "#3b82f6", bg: "#eff6ff" },
    { label: "3,000万 (アッパーマス)", value: 30000000, emoji: "🚀", color: "#7c3aed", bg: "#f5f3ff" },
    { label: "5,000万 (準富裕層)", value: 50000000, emoji: "💎", color: "#0369a1", bg: "#f0f9ff" },
    { label: "1億 (富裕層)", value: 100000000, emoji: "👑", color: "#d97706", bg: "#fffbeb" },
  ];

  const fmtV = v => v >= 1e8 ? `${(v/1e8).toFixed(v%1e8===0?0:1)}億円` : `${(v/1e4).toLocaleString("ja-JP")}万円`;

  const cards = milestones.map(ms => {
    const n = monthsToReach(ms.value);
    const reached = base >= ms.value;
    if (reached) {
      return `<div style="background:${ms.bg};border-radius:10px;padding:10px 12px;margin-bottom:8px;border:1.5px solid ${ms.color}40">
        <div style="display:flex;align-items:center;gap:8px">
          <span style="font-size:20px">${ms.emoji}</span>
          <div style="flex:1"><div style="font-size:11px;font-weight:800;color:${ms.color}">${ms.label}</div><div style="font-size:10px;color:#64748b">${fmtV(ms.value)}</div></div>
          <div style="font-size:13px;font-weight:900;color:${ms.color}">✅ 達成済み！</div>
        </div></div>`;
    }
    if (n === null) {
      return `<div style="background:#f8fafc;border-radius:10px;padding:10px 12px;margin-bottom:8px;border:1.5px solid #e2e8f0">
        <div style="display:flex;align-items:center;gap:8px">
          <span style="font-size:20px">${ms.emoji}</span>
          <div style="flex:1"><div style="font-size:11px;font-weight:800;color:#94a3b8">${ms.label}</div><div style="font-size:10px;color:#94a3b8">${fmtV(ms.value)}</div></div>
          <div style="font-size:10px;color:#94a3b8;text-align:right">100年以内に<br>到達困難</div>
        </div></div>`;
    }
    const arrivalDate = monthsToDate(n);
    const days = daysUntil(arrivalDate);
    const yrs = Math.floor(n/12), mos = n%12;
    const dur = yrs>0 ? `${yrs}年${mos>0?mos+"ヶ月":""}後` : `${mos}ヶ月後`;
    return `<div style="background:${ms.bg};border-radius:10px;padding:10px 12px;margin-bottom:8px;border:1.5px solid ${ms.color}40">
      <div style="display:flex;align-items:center;gap:8px">
        <span style="font-size:20px">${ms.emoji}</span>
        <div style="flex:1"><div style="font-size:11px;font-weight:800;color:${ms.color}">${ms.label}</div><div style="font-size:10px;color:#64748b">${fmtV(ms.value)}</div></div>
        <div style="text-align:right">
          <div style="font-size:13px;font-weight:900;color:${ms.color}">${fmtDate(arrivalDate)}</div>
          <div style="font-size:10px;color:#64748b">${dur}（残り<strong style="color:${ms.color}">${days.toLocaleString()}</strong>日）</div>
        </div>
      </div></div>`;
  });

  const el = document.getElementById("milestoneResult");
  if (el) el.innerHTML = cards.join("");

  const customInput = document.getElementById("customGoal");
  const customEl = document.getElementById("customGoalResult");
  if (customInput && customEl && customInput.value) {
    const customVal = parseFloat(customInput.value) * 10000;
    if (customVal > 0) {
      const n2 = monthsToReach(customVal);
      if (base >= customVal) {
        customEl.innerHTML = `<div style="font-size:12px;font-weight:700;color:#10b981">✅ ${fmtV(customVal)}はすでに達成済みです！</div>`;
      } else if (n2 === null) {
        customEl.innerHTML = `<div style="font-size:12px;color:#94a3b8">現在の条件では100年以内に到達できません</div>`;
      } else {
        const ad = monthsToDate(n2);
        const days2 = daysUntil(ad);
        const yrs2 = Math.floor(n2/12), mos2 = n2%12;
        const dur2 = yrs2>0 ? `${yrs2}年${mos2>0?mos2+"ヶ月":""}後` : `${mos2}ヶ月後`;
        customEl.innerHTML = `<div style="background:#eff6ff;border-radius:8px;padding:10px 12px;border:1.5px solid #bfdbfe">
          <div style="font-size:11px;color:#64748b;margin-bottom:2px">${fmtV(customVal)} 到達予測</div>
          <div style="font-size:16px;font-weight:900;color:#1d4ed8">${fmtDate(ad)}</div>
          <div style="font-size:11px;color:#3b82f6">${dur2}（残り <strong>${days2.toLocaleString()}</strong> 日）</div>
        </div>`;
      }
    }
  }
}

function renderCorrMatrix() {
  const funds=DATA.funds;
  if(funds.length<2){document.getElementById('corrMatrix').innerHTML='<div style="font-size:12px;color:#94a3b8">ファンドが2つ以上必要です</div>';return;}
  const allDates=[...new Set(funds.flatMap(f=>f.data.map(d=>d.date)))].sort((a,b)=>parseDate(a)-parseDate(b));
  function getDR(f){
    const nm={};f.data.filter(d=>d.pnlPct!=null).forEach(d=>nm[d.date]=f.cost_nav*(1+d.pnlPct/100));
    return allDates.slice(1).map((_,i)=>{const p=nm[allDates[i]],c=nm[allDates[i+1]];return p&&c?(c-p)/p:null;});
  }
  function corr(a,b){
    const pairs=a.map((v,i)=>[v,b[i]]).filter(([x,y])=>x!=null&&y!=null);
    if(pairs.length<5)return null;
    const n=pairs.length,mx=pairs.reduce((s,[x])=>s+x,0)/n,my=pairs.reduce((s,[,y])=>s+y,0)/n;
    const num=pairs.reduce((s,[x,y])=>s+(x-mx)*(y-my),0);
    const dx=Math.sqrt(pairs.reduce((s,[x])=>s+(x-mx)**2,0)),dy=Math.sqrt(pairs.reduce((s,[,y])=>s+(y-my)**2,0));
    return dx*dy===0?null:num/(dx*dy);
  }
  const series=funds.map(getDR);
  const bg=v=>v===null?'#f8faff':v>=0.8?'#1d4ed8':v>=0.5?'#3b82f6':v>=0.2?'#93c5fd':v>=-0.2?'#e2e8f0':v>=-0.5?'#fca5a5':'#ef4444';
  const tc=v=>v===null?'#94a3b8':Math.abs(v||0)>=0.5?'#fff':'#1e293b';
  // セルサイズをファンド数に応じて自動調整
  const n=funds.length;
  const cellPx = n<=4 ? 52 : n<=6 ? 42 : 34;
  const fontSize = n<=4 ? 11 : n<=6 ? 10 : 9;
  const labelSize = n<=4 ? 11 : n<=6 ? 10 : 9;
  let html=`<table style="border-collapse:collapse;font-size:${fontSize}px;table-layout:fixed;width:100%"><colgroup><col style="width:auto">${funds.map(()=>`<col style="width:${cellPx}px">`).join('')}</colgroup><thead><tr><th style="padding:3px 2px"></th>`;
  funds.forEach(f=>{
    // shortが長い場合は改行表示
    html+=`<th style="padding:3px 2px;color:#64748b;font-weight:700;text-align:center;font-size:${labelSize}px;overflow:hidden;text-overflow:ellipsis;max-width:${cellPx}px;white-space:nowrap" title="${f.short}">${f.short}</th>`;
  });
  html+=`</tr></thead><tbody>`;
  funds.forEach((f,i)=>{
    html+=`<tr><td style="padding:3px 4px;font-weight:700;color:#64748b;font-size:${labelSize}px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:60px" title="${f.short}">${f.short}</td>`;
    funds.forEach((_,j)=>{
      const v=i===j?1:corr(series[i],series[j]);
      html+=`<td style="padding:5px 2px;text-align:center;background:${bg(v)};color:${tc(v)};font-weight:${i===j?900:700};border-radius:3px;border:1px solid #f0f7ff">${v!=null?v.toFixed(2):"—"}</td>`;
    });
    html+=`</tr>`;
  });
  html+=`</tbody></table>`;
  let insights=[];
  funds.forEach((f,i)=>funds.forEach((_,j)=>{if(j<=i)return;const v=corr(series[i],series[j]);if(!v)return;
    if(v>=0.8)insights.push(`<span style="color:#1d4ed8">📌 ${funds[i].short}と${funds[j].short}は強く同調（${v.toFixed(2)}）</span>`);
    else if(v<=-0.3)insights.push(`<span style="color:#0d9488">✅ ${funds[i].short}と${funds[j].short}は分散効果あり（${v.toFixed(2)}）</span>`);
  }));
  if(insights.length)html+=`<div style="margin-top:10px;display:flex;flex-direction:column;gap:4px;font-size:11px">${insights.join("")}</div>`;
  document.getElementById('corrMatrix').innerHTML=html;
}

function renderHistogram() {
  const h=DATA.history;
  const dr=h.slice(1).map((d,i)=>h[i].total>0?(d.total-h[i].total)/h[i].total*100:null).filter(v=>v!==null);
  if(dr.length<5)return;
  const mean=dr.reduce((a,b)=>a+b,0)/dr.length;
  const std=Math.sqrt(dr.reduce((a,b)=>a+(b-mean)**2,0)/dr.length);
  const pos=dr.filter(v=>v>0).length/dr.length*100;
  const maxR=Math.max(...dr),minR=Math.min(...dr);
  document.getElementById('histStats').innerHTML=`
    <div class="hist-stat"><div class="card-label">平均日次リターン</div><div style="font-size:14px;font-weight:800;color:${col(mean)}">${mean>=0?"+":""}${mean.toFixed(3)}%</div></div>
    <div class="hist-stat"><div class="card-label">標準偏差（ボラ）</div><div style="font-size:14px;font-weight:800;color:#7c3aed">±${std.toFixed(3)}%</div></div>
    <div class="hist-stat"><div class="card-label">プラス日の割合</div><div style="font-size:14px;font-weight:800;color:#0d9488">${pos.toFixed(1)}%</div></div>
    <div class="hist-stat"><div class="card-label">最大騰落</div><div style="font-size:12px;font-weight:700;color:#64748b">🚀+${maxR.toFixed(2)}% / 💥${minR.toFixed(2)}%</div></div>`;
  const bins=20,bmin=Math.floor(minR*2)/2,bmax=Math.ceil(maxR*2)/2,bw=(bmax-bmin)/bins;
  const cnts=Array(bins).fill(0),lbls=[];
  for(let i=0;i<bins;i++)lbls.push((bmin+bw*(i+0.5)).toFixed(2)+"%");
  dr.forEach(v=>{let idx=Math.min(Math.max(Math.floor((v-bmin)/bw),0),bins-1);cnts[idx]++;});
  destroyChart('hist');
  const ctx=document.getElementById('histChart')?.getContext('2d'); if(!ctx)return;
  charts['hist']=new Chart(ctx,{type:'bar',
    data:{labels:lbls,datasets:[{data:cnts,backgroundColor:Array(bins).fill(0).map((_,i)=>(bmin+bw*(i+0.5))>=0?'rgba(13,148,136,0.7)':'rgba(225,29,72,0.7)'),borderWidth:0,borderRadius:2}]},
    options:{responsive:true,maintainAspectRatio:false,
      plugins:{legend:{display:false},tooltip:{callbacks:{label:c=>`${c.raw}日`}}},
      scales:{x:{grid:{display:false},ticks:{color:'#94a3b8',font:{size:9},maxTicksLimit:10}},
        y:{grid:{color:'#e2e8f0'},ticks:{color:'#94a3b8',font:{size:9}}}}}});
}

function renderDrawdown() {
  const h = DATA.history;
  if (h.length < 3) {
    document.getElementById('drawdownSummary').innerHTML = '<div style="font-size:12px;color:#94a3b8">データが不足しています（3日以上必要）</div>';
    return;
  }

  // ATHと各時点のドローダウン系列を計算
  let runningATH = h[0].total;
  const ddSeries = h.map(d => {
    if (d.total == null) return null;
    if (d.total > runningATH) runningATH = d.total;
    const dd = runningATH > 0 ? ((d.total - runningATH) / runningATH * 100) : 0;
    return parseFloat(dd.toFixed(2));
  });

  const latest = h[h.length - 1];
  const currentDD = ddSeries[ddSeries.length - 1];
  const maxDD = Math.min(...ddSeries.filter(v => v != null)); // 最大下落（最も負の値）
  const maxDDDate = h[ddSeries.indexOf(maxDD)]?.date;

  // 現在DDのレベル判定
  let ddLevel, ddColor, ddBg, ddIcon;
  const ddAbs = Math.abs(currentDD);
  if (ddAbs < 1)       { ddLevel="ATH圏内（ほぼ最高値）"; ddColor="#059669"; ddBg="#ecfdf5"; ddIcon="🏆"; }
  else if (ddAbs < 5)  { ddLevel="軽微な調整"; ddColor="#0d9488"; ddBg="#f0fdfa"; ddIcon="📈"; }
  else if (ddAbs < 10) { ddLevel="通常の調整局面"; ddColor="#0369a1"; ddBg="#eff6ff"; ddIcon="📊"; }
  else if (ddAbs < 20) { ddLevel="調整深め（買い増し検討）"; ddColor="#d97706"; ddBg="#fffbeb"; ddIcon="🟡"; }
  else if (ddAbs < 30) { ddLevel="ベア相場入り"; ddColor="#ea580c"; ddBg="#fff7ed"; ddIcon="🟠"; }
  else                 { ddLevel="暴落局面！バーゲンセール！"; ddColor="#dc2626"; ddBg="#fff1f2"; ddIcon="🔴"; }

  // サマリー表示
  document.getElementById('drawdownSummary').innerHTML = `
    <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px">
      <div style="background:${ddBg};border-radius:10px;padding:10px;border:1px solid ${ddColor}30">
        <div style="font-size:10px;color:#64748b;margin-bottom:3px">現在のDD</div>
        <div style="font-size:19px;font-weight:900;color:${ddColor}">${currentDD.toFixed(2)}%</div>
        <div style="font-size:10px;font-weight:700;color:${ddColor};margin-top:2px">${ddIcon} ${ddLevel}</div>
      </div>
      <div style="background:#f8fafc;border-radius:10px;padding:10px;border:1px solid #e2e8f0">
        <div style="font-size:10px;color:#64748b;margin-bottom:3px">最大DD（史上）</div>
        <div style="font-size:19px;font-weight:900;color:#e11d48">${maxDD.toFixed(2)}%</div>
        <div style="font-size:10px;color:#94a3b8;margin-top:2px">${maxDDDate || "—"}</div>
      </div>
      <div style="background:#f8fafc;border-radius:10px;padding:10px;border:1px solid #e2e8f0">
        <div style="font-size:10px;color:#64748b;margin-bottom:3px">ATH</div>
        <div style="font-size:14px;font-weight:900;color:#f59e0b">${fmt(Math.round(calcATH()))}</div>
        <div style="font-size:10px;color:#94a3b8;margin-top:2px">過去最高評価額</div>
      </div>
    </div>`;

  // バーゲンセール判定
  const bargainThreshold = -10;
  const isBargain = currentDD <= bargainThreshold;
  const historicalBargains = h.filter((d, i) => ddSeries[i] != null && ddSeries[i] <= bargainThreshold);
  const bargainEl = document.getElementById('drawdownBargain');
  if (isBargain) {
    bargainEl.innerHTML = `
      <div style="background:linear-gradient(135deg,#fff7ed,#ffedd5);border:1.5px solid #fb923c;border-radius:10px;padding:10px 12px">
        <div style="font-size:11px;font-weight:800;color:#c2410c;margin-bottom:4px">🛒 バーゲンセール中！買い増しチャンス</div>
        <div style="font-size:11px;color:#9a3412">ATHから <strong>${ddAbs.toFixed(2)}%</strong> 下落中。過去の回復実績からすると仕込み場の可能性があります。</div>
      </div>`;
  } else if (historicalBargains.length > 0) {
    bargainEl.innerHTML = `
      <div style="background:#f8fafc;border-radius:8px;padding:8px 10px;border:1px solid #e2e8f0">
        <div style="font-size:10px;color:#64748b;font-weight:700">過去のバーゲンセール（DD -10%以下）</div>
        <div style="font-size:11px;color:#94a3b8;margin-top:3px">計 ${historicalBargains.length} 日間。直近: ${historicalBargains[historicalBargains.length-1].date}</div>
      </div>`;
  } else {
    bargainEl.innerHTML = '';
  }

  // チャート描画
  destroyChart('drawdown');
  const ctx = document.getElementById('drawdownChart')?.getContext('2d');
  if (!ctx) return;
  const r = dotSize(h.length);

  // 色付き背景のためzone annotations風にデータセットを分ける
  charts['drawdown'] = new Chart(ctx, {
    type: 'line',
    data: {
      labels: h.map(d => d.date),
      datasets: [
        {
          label: 'ドローダウン',
          data: ddSeries,
          borderColor: '#e11d48',
          backgroundColor: (context) => {
            const chart = context.chart;
            const {ctx: c, chartArea} = chart;
            if (!chartArea) return 'rgba(225,29,72,0.15)';
            const gradient = c.createLinearGradient(0, chartArea.top, 0, chartArea.bottom);
            gradient.addColorStop(0, 'rgba(225,29,72,0.02)');
            gradient.addColorStop(1, 'rgba(225,29,72,0.25)');
            return gradient;
          },
          borderWidth: 2,
          pointRadius: r,
          pointHoverRadius: r + 2,
          pointBackgroundColor: '#e11d48',
          tension: 0.3,
          fill: true,
          spanGaps: true,
        },
        // -10%ライン（バーゲンセール閾値）
        {
          label: 'バーゲン閾値(-10%)',
          data: h.map(() => -10),
          borderColor: '#f59e0b',
          backgroundColor: 'transparent',
          borderWidth: 1.5,
          borderDash: [6, 4],
          pointRadius: 0,
          tension: 0,
          fill: false,
        },
        // 0ライン
        {
          label: 'ATH(0%)',
          data: h.map(() => 0),
          borderColor: '#10b981',
          backgroundColor: 'transparent',
          borderWidth: 1,
          borderDash: [3, 3],
          pointRadius: 0,
          tension: 0,
          fill: false,
        }
      ]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      plugins: {
        legend: {
          display: true,
          labels: { color: '#64748b', font: { size: 10 }, boxWidth: 16, padding: 10 }
        },
        tooltip: {
          callbacks: {
            label: c => c.datasetIndex === 0
              ? `DD: ${c.raw?.toFixed(2)}%`
              : c.dataset.label
          }
        }
      },
      scales: {
        x: {
          grid: { color: '#f1f5f9' },
          ticks: { color: '#94a3b8', font: { size: 9 }, maxTicksLimit: 10 }
        },
        y: {
          max: 2,
          grid: { color: '#f1f5f9' },
          ticks: {
            color: '#94a3b8',
            font: { size: 9 },
            callback: v => `${v}%`
          }
        }
      }
    }
  });
}

// ── 機能2: モメンタム・テクニカル分析 ──
function renderMomentum() {
  const el = document.getElementById('momentumPanel');
  if (!el) return;
  const h = DATA.history;
  if (h.length < 6) { el.innerHTML = '<div style="font-size:12px;color:#94a3b8">データが不足しています（6日以上必要）</div>'; return; }

  // ポートフォリオ全体の評価額系列で SMA・RSI を計算
  const totalSeries = h.map(d => d.total);

  // SMA 計算
  const smaOf = (n) => totalSeries.length>=n ? totalSeries.slice(-n).reduce((a,b)=>a+b,0)/n : null;
  const sma5  = smaOf(5);
  const sma20 = smaOf(Math.min(20, h.length));
  const prevSma5  = totalSeries.length>=6  ? totalSeries.slice(-6,-1).reduce((a,b)=>a+b,0)/5  : null;
  const prevSma20 = totalSeries.length>=21 ? totalSeries.slice(-21,-1).reduce((a,b)=>a+b,0)/20 : null;

  const hasCross = sma5&&sma20&&prevSma5&&prevSma20;
  const isGolden  = hasCross && prevSma5<=prevSma20 && sma5>sma20;
  const isDead    = hasCross && prevSma5>=prevSma20 && sma5<sma20;
  const isBullish = sma5 && sma20 && sma5 > sma20;

  let crossLabel, crossColor, crossBg, crossIcon;
  if (isGolden)       { crossIcon="🌟"; crossLabel="ゴールデンクロス発生！"; crossColor="#059669"; crossBg="#ecfdf5"; }
  else if (isDead)    { crossIcon="💀"; crossLabel="デッドクロス発生！"; crossColor="#dc2626"; crossBg="#fff1f2"; }
  else if (!hasCross) { crossIcon="➡️"; crossLabel="データ不足（20日分必要）"; crossColor="#94a3b8"; crossBg="#f8fafc"; }
  else if (isBullish) { crossIcon="📈"; crossLabel="上昇トレンド中（5MA > 20MA）"; crossColor="#2563eb"; crossBg="#eff6ff"; }
  else                { crossIcon="📉"; crossLabel="下落トレンド中（5MA < 20MA）"; crossColor="#c2410c"; crossBg="#fff7ed"; }

  // SMAチャート用データ（直近30件）
  const recent = h.slice(-30);

  // RSI(14) 計算
  let rsiHtml = "";
  if (h.length >= 15) {
    const changes = totalSeries.slice(-15).slice(1).map((v,i)=>v - totalSeries.slice(-15)[i]);
    const gains  = changes.filter(c=>c>0).reduce((a,b)=>a+b,0)/14;
    const losses = Math.abs(changes.filter(c=>c<0).reduce((a,b)=>a+b,0))/14;
    const rs = losses===0 ? 100 : gains/losses;
    const rsi = Math.round(100 - 100/(1+rs));
    const pct = rsi; // 0-100 をそのまま %幅に使う
    let rsiLabel, rsiColor, rsiZone;
    if (rsi>=70)      { rsiLabel=`過熱気味 (${rsi})`; rsiColor="#dc2626"; rsiZone="買われすぎゾーン"; }
    else if (rsi>=55) { rsiLabel=`やや強め (${rsi})`; rsiColor="#0d9488"; rsiZone=""; }
    else if (rsi>=45) { rsiLabel=`中立 (${rsi})`; rsiColor="#64748b"; rsiZone=""; }
    else if (rsi>=30) { rsiLabel=`やや弱め (${rsi})`; rsiColor="#ea580c"; rsiZone=""; }
    else              { rsiLabel=`バーゲン域！ (${rsi})`; rsiColor="#7c3aed"; rsiZone="売られすぎゾーン＝買い増し検討"; }

    // メーターバー
    rsiHtml = `
      <div style="margin-top:12px">
        <div style="font-size:10px;color:#064e3b;font-weight:700;margin-bottom:6px">📊 RSI（14日）— 相対力指数</div>
        <div style="position:relative;height:20px;border-radius:10px;overflow:hidden;background:linear-gradient(to right,#7c3aed,#3b82f6,#0d9488,#f59e0b,#dc2626)">
          <div style="position:absolute;top:0;bottom:0;left:${pct}%;width:3px;background:#fff;border-radius:2px;transform:translateX(-50%);box-shadow:0 0 6px rgba(0,0,0,0.5)"></div>
        </div>
        <div style="display:flex;justify-content:space-between;font-size:9px;color:#94a3b8;margin-top:2px;padding:0 2px">
          <span>0 売られすぎ</span><span>30</span><span>50</span><span>70</span><span>買われすぎ 100</span>
        </div>
        <div style="margin-top:8px;display:flex;align-items:center;gap:8px">
          <div style="font-size:22px;font-weight:900;color:${rsiColor}">${rsi}</div>
          <div>
            <div style="font-size:12px;font-weight:700;color:${rsiColor}">${rsiLabel}</div>
            ${rsiZone ? `<div style="font-size:10px;color:${rsiColor};font-weight:600">${rsiZone}</div>` : ""}
          </div>
        </div>
      </div>`;
  }

  el.innerHTML = `
    <div style="background:${crossBg};border-radius:10px;padding:10px 12px;border:1.5px solid ${crossColor}40;margin-bottom:12px">
      <div style="font-size:10px;color:#064e3b;font-weight:700;margin-bottom:6px">📈 移動平均クロス（5MA / 20MA）</div>
      <div style="display:flex;align-items:center;gap:10px;margin-bottom:8px">
        <span style="font-size:22px">${crossIcon}</span>
        <div>
          <div style="font-size:13px;font-weight:800;color:${crossColor}">${crossLabel}</div>
          ${sma5&&sma20 ? `<div style="font-size:10px;color:#64748b;margin-top:2px">5MA: ${fmt(Math.round(sma5))} ／ 20MA: ${fmt(Math.round(sma20))}</div>` : ""}
        </div>
      </div>
      <div style="position:relative;height:100px"><canvas id="momentumChart"></canvas></div>
      <div style="display:flex;gap:12px;margin-top:4px">
        <div style="display:flex;align-items:center;gap:4px;font-size:10px;color:#64748b"><div style="width:12px;height:2px;background:#3b82f6;border-radius:2px"></div>評価額</div>
        <div style="display:flex;align-items:center;gap:4px;font-size:10px;color:#0d9488"><div style="width:12px;height:2px;background:#0d9488;border-radius:2px"></div>5MA</div>
        <div style="display:flex;align-items:center;gap:4px;font-size:10px;color:#f59e0b"><div style="width:12px;height:2px;background:#f59e0b;border-radius:2px;border-top:1px dashed #f59e0b"></div>20MA</div>
      </div>
    </div>
    ${rsiHtml}
    <div style="font-size:10px;color:#94a3b8;margin-top:10px">※ 移動平均・RSIはポートフォリオ合計評価額から算出した参考値です</div>`;

  // SMAチャート描画
  setTimeout(() => {
    const ctx3 = document.getElementById('momentumChart')?.getContext('2d');
    if (!ctx3) return;
    if (charts['momentum']) { charts['momentum'].destroy(); delete charts['momentum']; }
    const sma5Arr  = recent.map((_,i,arr) => {
      const sl = arr.slice(0,i+1);
      return sl.length>=5 ? sl.slice(-5).reduce((a,b)=>a+b.total,0)/5 : null;
    });
    const sma20Arr = recent.map((_,i,arr) => {
      // 直近30件なのでグローバルのhからオフセット計算
      const globalIdx = h.findIndex(d=>d.date===arr[i].date);
      const sl = h.slice(0,globalIdx+1);
      return sl.length>=20 ? sl.slice(-20).reduce((a,b)=>a+b.total,0)/20 : null;
    });
    charts['momentum'] = new Chart(ctx3, {type:'line',
      data:{labels:recent.map(d=>d.date),datasets:[
        {label:'評価額',data:recent.map(d=>d.total),borderColor:'#3b82f6',backgroundColor:'rgba(59,130,246,0.06)',
         borderWidth:2,pointRadius:0,tension:0.3,fill:true,order:1},
        {label:'5MA',data:sma5Arr,borderColor:'#0d9488',backgroundColor:'transparent',
         borderWidth:1.5,pointRadius:0,tension:0.3,spanGaps:true,order:2},
        {label:'20MA',data:sma20Arr,borderColor:'#f59e0b',backgroundColor:'transparent',
         borderWidth:1.5,borderDash:[5,3],pointRadius:0,tension:0.3,spanGaps:true,order:3}
      ]},
      options:{responsive:true,maintainAspectRatio:false,
        plugins:{legend:{display:false},
          tooltip:{callbacks:{label:c=>`${c.dataset.label}：${fmtRaw(Math.round(c.raw||0))}`}}},
        scales:{
          x:{display:false,grid:{display:false}},
          y:{grid:{color:'#f1f5f9'},ticks:{color:'#94a3b8',font:{size:9},maxTicksLimit:4,
            callback:v=>_stealthMode?'¥ ****':`¥${(v/1e6).toFixed(1)}M`}}
        }
      }
    });
  }, 60);
}



// ===== 動的テーマエンジン =====
let _lastThemeKey = null;

function applyDynamicTheme() {
  if (!DATA || !DATA.history || DATA.history.length < 2) return;
  const h = DATA.history;
  const latest = h[h.length - 1];
  const ath = calcATH();
  const isATH = ath != null && latest.total >= ath;

  // ドローダウン率（現在値 vs ATH）
  const ddPct = ath ? (latest.total - ath) / ath * 100 : 0;
  const isDrawdown = ddPct < -5;
  const isSevereDrawdown = ddPct < -15;

  // 資産クラス閾値
  const TIERS = [
    { value: 100000000, key: "oku",    emoji: "👑", label: "1億円クラス到達",   accent: "#d97706", accent2: "#fbbf24", from: "#fffbeb", to: "#fef3c7", bg: "#fffbeb", border: "#fbbf24", glow: "rgba(217,119,6,0.4)", geo: true },
    { value:  50000000, key: "j_rich", emoji: "💎", label: "準富裕層クラス",     accent: "#0369a1", accent2: "#38bdf8", from: "#e0f2fe", to: "#f0f9ff", bg: "#f0f9ff", border: "#7dd3fc", glow: "rgba(3,105,161,0.3)", geo: true },
    { value:  30000000, key: "upper",  emoji: "🚀", label: "アッパーマスクラス", accent: "#7c3aed", accent2: "#a78bfa", from: "#f5f3ff", to: "#ede9fe", bg: "#f5f3ff", border: "#c4b5fd", glow: "rgba(124,58,237,0.3)", geo: true },
    { value:  10000000, key: "1000",   emoji: "🎯", label: "1000万円クラス",     accent: "#0d9488", accent2: "#34d399", from: "#ecfdf5", to: "#f0fdf4", bg: "#f0fdf4", border: "#6ee7b7", glow: "rgba(13,148,136,0.3)", geo: false },
    { value:   5000000, key: "500",    emoji: "🌱", label: "500万円クラス",      accent: "#2563eb", accent2: "#60a5fa", from: "#dbeafe", to: "#eff6ff", bg: "#f0f7ff", border: "#bfdbfe", glow: "rgba(37,99,235,0.3)", geo: false },
  ];

  let theme;
  if (isATH) {
    theme = {
      key: "ath", emoji: "🏆", label: "ATH更新中！",
      accent: "#d97706", accent2: "#fbbf24",
      from: "linear-gradient(135deg,#fef9c3,#fde68a)", to: "#fffbeb",
      bg: "#fffbeb", border: "#fbbf24", glow: "rgba(251,191,36,0.5)",
      geo: false, flash: "#fbbf24"
    };
  } else if (isSevereDrawdown) {
    theme = {
      key: "severe_dd", emoji: "🛡️", label: `深刻なドローダウン ${ddPct.toFixed(1)}%`,
      accent: "#1e3a5f", accent2: "#334155",
      from: "#1e293b", to: "#0f172a",
      bg: "#0f172a", border: "#334155", glow: "rgba(30,58,95,0.6)",
      geo: false, flash: "#1e293b", dark: true
    };
  } else if (isDrawdown) {
    theme = {
      key: "drawdown", emoji: "🌊", label: `ドローダウン中 ${ddPct.toFixed(1)}%`,
      accent: "#1d4ed8", accent2: "#3b82f6",
      from: "#1e3a5f", to: "#1e40af",
      bg: "#f0f4ff", border: "#93c5fd", glow: "rgba(29,78,216,0.3)",
      geo: false, flash: "#3b82f6"
    };
  } else {
    // 資産クラスに応じたテーマ
    theme = TIERS.find(t => latest.total >= t.value) || {
      key: "default", emoji: "📊", label: "通常",
      accent: "#3b82f6", accent2: "#60a5fa",
      from: "#dbeafe", to: "#f0f7ff",
      bg: "#f0f7ff", border: "#bfdbfe", glow: "rgba(59,130,246,0.3)",
      geo: false
    };
  }

  const isDark = theme.dark || false;
  const isNewTheme = theme.key !== _lastThemeKey;
  _lastThemeKey = theme.key;

  // ボディ背景更新
  document.body.style.background = theme.bg;
  if (isDark) {
    document.body.style.color = '#e2e8f0';
  } else {
    document.body.style.color = '#1e293b';
  }

  // CSS変数を適用
  const root = document.documentElement;
  root.style.setProperty('--theme-accent', theme.accent);
  root.style.setProperty('--theme-accent2', theme.accent2);
  root.style.setProperty('--theme-header-from', theme.from.includes('gradient') ? '#1e3a5f' : theme.from);
  root.style.setProperty('--theme-header-to', theme.to);
  root.style.setProperty('--theme-bg', theme.bg);
  root.style.setProperty('--theme-border', theme.border);
  root.style.setProperty('--theme-label', isDark ? '#93c5fd' : theme.accent);
  root.style.setProperty('--theme-glow', theme.glow);

  // ヘッダーグラデーション直接適用
  const header = document.querySelector('.header');
  if (header) {
    if (theme.from.includes('gradient')) {
      header.style.background = `${theme.from}, linear-gradient(180deg,#1e3a5f,#0f172a)`;
      header.style.background = 'linear-gradient(180deg,#1e3a5f,#0f172a)';
    } else {
      header.style.background = `linear-gradient(180deg,${theme.from},${theme.to})`;
    }
    // ダークテーマ時は文字色も変更
    if (isDark) {
      header.style.color = '#e2e8f0';
      const h1 = header.querySelector('h1');
      if (h1) h1.style.color = '#e2e8f0';
    } else {
      header.style.color = '';
      const h1 = header.querySelector('h1');
      if (h1) h1.style.color = '#1e3a5f';
    }
  }

  // theme-color metaタグ更新（PWAステータスバー）
  let tcMeta = document.querySelector('meta[name="theme-color"]');
  if (tcMeta) tcMeta.setAttribute('content', theme.accent);

  // フラッシュ演出（テーマ変化時のみ）
  if (isNewTheme && theme.flash) {
    const flash = document.getElementById('themeFlash');
    flash.style.background = theme.flash;
    flash.classList.remove('show');
    void flash.offsetWidth;
    flash.classList.add('show');
    setTimeout(() => flash.classList.remove('show'), 900);
  }

  // 幾何学テクスチャ（資産クラスに応じてアンロック）
  const geoCanvas = document.getElementById('geoTexture');
  if (theme.geo && isNewTheme) {
    geoCanvas.classList.add('show');
    drawGeoTexture(geoCanvas, theme.accent);
  } else if (!theme.geo) {
    geoCanvas.classList.remove('show');
  }

  // テーマバッジ表示（変化時のみ）
  if (isNewTheme) {
    const badge = document.getElementById('themeBadge');
    badge.style.cssText = `display:block;bottom:16px;right:16px;z-index:50;padding:6px 12px;border-radius:20px;font-size:11px;font-weight:800;background:${theme.accent};color:#fff;box-shadow:0 2px 12px ${theme.glow};animation:badgeIn 0.5s cubic-bezier(0.34,1.56,0.64,1) forwards;position:fixed;pointer-events:none;`;
    badge.textContent = `${theme.emoji} ${theme.label}`;
    clearTimeout(badge._hideTimer);
    badge._hideTimer = setTimeout(() => { badge.style.display = 'none'; }, 3000);
  }
}

function drawGeoTexture(canvas, color) {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
  const ctx = canvas.getContext('2d');
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  // ヘックスグリッドパターン
  const size = 40;
  const h = size * Math.sqrt(3);
  ctx.strokeStyle = color;
  ctx.lineWidth = 0.5;
  ctx.globalAlpha = 0.08;

  for (let row = -1; row < canvas.height / h + 2; row++) {
    for (let col = -1; col < canvas.width / (size * 1.5) + 2; col++) {
      const x = col * size * 1.5;
      const y = row * h + (col % 2 === 0 ? 0 : h / 2);
      ctx.beginPath();
      for (let i = 0; i < 6; i++) {
        const angle = (Math.PI / 3) * i - Math.PI / 6;
        const px = x + size * 0.9 * Math.cos(angle);
        const py = y + size * 0.9 * Math.sin(angle);
        i === 0 ? ctx.moveTo(px, py) : ctx.lineTo(px, py);
      }
      ctx.closePath();
      ctx.stroke();
    }
  }

  // ダイヤ型ポイントアクセント
  ctx.globalAlpha = 0.06;
  ctx.fillStyle = color;
  for (let i = 0; i < 30; i++) {
    const x = Math.random() * canvas.width;
    const y = Math.random() * canvas.height;
    const s = 4 + Math.random() * 8;
    ctx.beginPath();
    ctx.moveTo(x, y - s);
    ctx.lineTo(x + s * 0.6, y);
    ctx.lineTo(x, y + s);
    ctx.lineTo(x - s * 0.6, y);
    ctx.closePath();
    ctx.fill();
  }
}
